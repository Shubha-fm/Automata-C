name: Automata C programs 251-260

on:
  push:
    branches: [main]
    paths:
      - 'programs/25[1-9]_*.c'
      - 'programs/260_*.c'
      - 'include/dfa_io.h'
      - 'tests/test_programs_251_260.py'
      - 'Makefile'
      - '.github/workflows/automata-251-260.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run regression checks
        run: make test-251-260 CC=gcc CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
