name: Automata C programs 241-250

on:
  push:
    branches: [main]
    paths:
      - 'programs/24[1-9]_*.c'
      - 'programs/250_*.c'
      - 'include/dfa_io.h'
      - 'tests/test_programs_241_250.py'
      - 'Makefile'
      - '.github/workflows/automata-241-250.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run regression checks
        run: make test-241-250 CC=gcc CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
