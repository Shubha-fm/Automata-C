name: Automata C programs 291-300

on:
  push:
    branches: [main]
    paths:
      - 'programs/29[1-9]_*.c'
      - 'programs/300_*.c'
      - 'include/dfa_io.h'
      - 'tests/test_programs_291_300.py'
      - 'Makefile'
      - '.github/workflows/automata-291-300.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run regression checks
        run: make test-291-300 CC=gcc CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
