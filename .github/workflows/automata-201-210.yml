name: Automata C programs 201-210

on:
  push:
    branches: [main]
    paths:
      - 'programs/20[1-9]_*.c'
      - 'programs/210_*.c'
      - 'tests/test_programs_201_210.py'
      - 'Makefile'
      - '.github/workflows/automata-201-210.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run regression checks
        run: make test-201-210 CC=gcc CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
